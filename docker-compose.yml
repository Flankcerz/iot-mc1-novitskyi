services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mc1-mosquitto
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  openhab:
    image: openhab/openhab:latest
    container_name: mc1-openhab
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Kyiv
      EXTRA_JAVA_OPTS: "-Djavax.net.ssl.trustStore=/certs/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS"
      KEYPAD_PIN: ${KEYPAD_PIN}
    volumes:
      - ./openhab/conf:/openhab/conf
      - openhab_userdata:/openhab/userdata
      - ./certs:/certs:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  openhab_userdata:
